<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosteuskartoitus</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        /* TABIT */
        .tabs {
            display: flex;
            background: #2c3e50;
            color: white;
        }

        .tab {
            padding: 15px 20px;
            cursor: pointer;
            border-right: 1px solid #1b2a36;
        }

        .tab.active {
            background: #34495e;
            font-weight: bold;
        }

        .content {
            padding: 20px;
        }

        /* Osiot */
        .section-title {
            margin-top: 30px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px solid #555;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px,1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="file"] {
            margin-top: 10px;
        }

        .rappu-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }

        .btn:hover {
            background: #2980b9;
        }

        #huoneistoLista {
            background: white;
            padding: 10px;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
        }

        /* Huoneistonavigointi */
        .apt-nav {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .apt-nav button {
            padding: 8px 14px;
            background: #34495e;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .apt-nav input {
            padding: 10px;
            width: 120px;
            border: 1px solid #aaa;
            border-radius: 4px;
            text-align: center;
        }

        #dynaamiset_osiot {
            background: white;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        #status, #status_kartoitus {
            margin-top: 10px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

    <!-- TABIT -->
    <div class="tabs">
        <div class="tab active" id="tabPerustiedot">Perustiedot</div>
        <div class="tab" id="tabKartoitus">Huoneistot</div>
    </div>

    <!-- ========================= -->
    <!--     PERUSTIEDOT-TABI     -->
    <!-- ========================= -->
    <div class="content" id="perustiedotTab">

        <!-- ✅ KOHDEHAKU -->
        <div class="section-title">Hae aiempi kohde</div>
        <input 
            type="text" 
            id="kohde_haku" 
            placeholder="Kirjoita kohteen nimi..." 
            style="width:100%; padding:10px; margin-bottom:10px;"
        >
        <div id="kohdeHakulista" 
             style="background:white; border:1px solid #ddd; padding:10px; border-radius:4px; max-height:200px; overflow-y:auto;">
        </div>

        <!-- ✅ TILAAJA -->
        <div class="section-title">Tilaajan tiedot</div>
        <div class="form-grid">
            <input type="text" id="tilaaja_etunimi" placeholder="Etunimi">
            <input type="text" id="tilaaja_sukunimi" placeholder="Sukunimi">
            <input type="text" id="tilaaja_yritys" placeholder="Yritys">
            <input type="email" id="tilaaja_email" placeholder="Sähköposti">
            <input type="tel" id="tilaaja_puhelin" placeholder="Puhelin">
            <input type="text" id="tilaaja_osoite" placeholder="Osoite">
            <input type="text" id="tilaaja_postinumero" placeholder="Postinumero">
            <input type="text" id="tilaaja_postitoimipaikka" placeholder="Postitoimipaikka">
        </div>

        <!-- ✅ KOHDE -->
        <div class="section-title">Kohteen tiedot</div>
        <div class="form-grid">
            <input type="text" id="kohde_nimi" placeholder="Kohteen nimi">
            <input type="text" id="kohde_osoite" placeholder="Osoite">
            <input type="text" id="kohde_postinumero" placeholder="Postinumero">
            <input type="text" id="kohde_postitoimipaikka" placeholder="Postitoimipaikka">
            <input type="date" id="kohde_paiva" placeholder="Tarkastuspäivä">
            <input type="text" id="kohde_tarkastaja" placeholder="Tarkastajan nimi">
        </div>

        <!-- ✅ KANSIKUVA + ESIKATSELU -->
        <div class="section-title">Kohteen kansikuva</div>
        <div>
            <input type="file" id="kansikuva" accept="image/*">
            <br>
            <img id="kansiPreview" 
                 style="max-width:250px; display:none; margin-top:10px; border:1px solid #ccc; border-radius:4px;">
        </div>

        <!-- ✅ RAPUT -->
        <div class="section-title">Rappujen syöttö</div>

        <div class="rappu-row">
            <input type="text" id="rappu_nimi" placeholder="Rappu (esim. 'Talo A')">
            <input type="number" id="rappu_alku" placeholder="Alku nro">
            <input type="number" id="rappu_loppu" placeholder="Loppu nro">
            <button class="btn" id="btnLisaRappu">Lisää rappu</button>
        </div>

        <!-- ✅ RAPPUJEN LISTA -->
        <div class="section-title">Lisätyt raput</div>
        <div id="rappuListaContainer"></div>

        <!-- ✅ HUONEISTOJEN LISTA -->
        <div class="section-title">Luodut huoneistot</div>
        <div id="huoneistoLista"></div>

        <div id="status"></div>
    </div>
    <button class="btn" id="btnCreatePdf" style="margin-top:20px;">Luo PDF-raportti</button>
    <!-- ========================= -->
    <!--     HUONEISTOT-TABI      -->
    <!-- ========================= -->
    <div class="content" id="kartoitusTab" style="display:none;">

        <!-- ✅ NAVIGOINTI -->
        <div class="apt-nav">
            <button id="prevApt">⬅️</button>
            <input type="text" id="currentAptInput" placeholder="A12">
            <button id="nextApt">➡️</button>
        </div>

  <!-- Ei voitu tarkastaa -->
  <div class="ei-tarkastettu">

<section class="materials-section">
<h3>PINTARAKENTEIDEN MATERIAALIT</h3>
    

<h3>LATTIAN PINTAMATERIAALI</h3>
<div class="checkbox-group" id="lattia_group">
    <label><input type="checkbox" value="Laatta"> Laatta</label>
    <label><input type="checkbox" value="Muovimatto"> Muovimatto</label>
    <label><input type="checkbox" value="Laminaatti"> Laminaatti</label>
    <label><input type="checkbox" value="Vinyyli"> Vinyyli</label>
    <label><input type="checkbox" value="Epoksi"> Epoksi</label>
    <label><input type="checkbox" value="Muu" onchange="toggleLattiaMuu()"> Muu</label>
</div>

<input 
    type="text" 
    id="lattia_muu" 
    placeholder="Mikä muu lattiapäällyste?" 
    style="display:none; margin-top:5px;"
>
<h3>SEINIEN PINTAMATERIAALI</h3>
<div class="checkbox-group" id="seina_group">
    <label><input type="checkbox" value="Laatta"> Laatta</label>
    <label><input type="checkbox" value="Muovitapetti"> Muovimatto</label>
    <label><input type="checkbox" value="Pelti"> Laminaatti</label>
    <label><input type="checkbox" value="Maali"> Vinyyli</label>
    <label><input type="checkbox" value="Muu" onchange="toggleSeinaMuu()"> Muu</label>
</div>

<input 
    type="text" 
    id="seina_muu" 
    placeholder="Mikä muu seinäpäällyste?" 
    style="display:none; margin-top:5px;"
>
<h3>KATON PINTAMATERIAALI</h3>
<div class="checkbox-group" id="katto_group">
    <label><input type="checkbox" value="Betoni"> Betoni</label>
    <label><input type="checkbox" value="Paneeli"> Paneeli</label>
    <label><input type="checkbox" value="Kipsilevy"> Kipsilevy</label>
    <label><input type="checkbox" value="Pelti"> Pelti</label>
    <label><input type="checkbox" value="Muu" onchange="toggleKattoMuu()"> Muu</label>
</div>
>
<input 
    type="text" 
    id="katto_muu" 
    placeholder="Mikä muu kattopinta?" 
    style="display:none; margin-top:5px;"
>   
<h3>VESIPUTKET</h3>
<div class="checkbox-group" id="vesiputki_group">
    <label><input type="checkbox" value="Uppoasennuksena"> Uppo</label>
    <label><input type="checkbox" value="Pintavetoina"> Pinta</label>
    <label><input type="checkbox" value="Kupari"> Kupari</label>
    <label><input type="checkbox" value="Muovi"> Muovi</label>

</div>
<!-- ✅ Dynaaminen kartoituslomake -->
<div id="dynaamiset_osiot"></div>


        <!-- ✅ HUONEISTOKUVAT -->
        <div class="section-title">Huoneiston kuvat (1–2 kpl)</div>

        <div>
            <input type="file" id="kuva1" accept="image/*">
            <br>
            <img id="preview1" 
                 style="max-width:200px; display:none; margin-top:10px; border:1px solid #ccc; border-radius:4px;">
        </div>

        <div style="margin-top:15px;">
            <input type="file" id="kuva2" accept="image/*">
            <br>
            <img id="preview2" 
                 style="max-width:200px; display:none; margin-top:10px; border:1px solid #ccc; border-radius:4px;">
        </div>

        <div id="status_kartoitus"></div>
    </div>

    <!-- ========================================================= -->
    <!--                   App.js sisällytys                       -->
    <!-- ========================================================= -->
    <script src="app.js"></script>

  <!-- Ei voitu tarkastaa -->
  <div class="ei-tarkastettu">
<script>
function toggleLattiaMuu() {
    const muu = document.querySelector('#lattia_group input[value="Muu"]').checked;
    document.getElementById("lattia_muu").style.display = muu ? "block" : "none";
}

function toggleSeinaMuu() {
    const muu = document.querySelector('#seina_group input[value="Muu"]').checked;
    document.getElementById("seina_muu").style.display = muu ? "block" : "none";
}

function toggleKattoMuu() {
    const muu = document.querySelector('#katto_group input[value="Muu"]').checked;
    document.getElementById("katto_muu").style.display = muu ? "block" : "none";
}
</script>

</body>
</html>
</body>
</html>
