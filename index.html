<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kosteuskartoitus – Offline</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

<h2>Kosteuskartoitus – Offline lomake</h2>

<form id="form">

    <h3>Perustiedot</h3>

    <label>Huoneisto</label>
    <input type="text" id="huoneisto" required>

    <label>Päivämäärä</label>
    <input type="date" id="pvm" required>

    <label>Valokuva</label>
    <input type="file" id="kuva" accept="image/*" capture="environment">

    <h3>Varaaja</h3>
    <div id="varaaja_wrapper">
        <input type="text" id="varaaja" placeholder="Varaajan tyyppi / huomio">
    </div>
    <button type="button" id="varaaja_toggle_btn" onclick="toggleVaraaja()">
        Piilota varaaja
    </button>

    <!-- ✅ tänne dynaamiset osiot -->
    <div id="dynaamiset_osiot"></div>

    <button type="submit">Tallenna</button>
</form>

<p id="status"></p>

<script src="db.js"></script>
<script src="app.js"></script>

<script>
let varaajaPiilotettu = false;

function toggleVaraaja() {
    const wrapper = document.getElementById("varaaja_wrapper");
    const input = document.getElementById("varaaja");
    const btn = document.getElementById("varaaja_toggle_btn");

    if (!varaajaPiilotettu) {
        wrapper.style.display = "none";
        input.value = "";
        varaajaPiilotettu = true;
        btn.textContent = "Tuo takaisin";
    } else {
        wrapper.style.display = "block";
        varaajaPiilotettu = false;
        btn.textContent = "Piilota varaaja";
    }
}

document.getElementById("pvm").value = new Date().toISOString().split("T")[0];

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
